<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Context Ring</title>
  <style>
    :root {
      --cds-gray-20: #f9f9f7;
      --cds-gray-200: #c2c2c2;
      --cds-gray-400: #878787;
      --cds-gray-900: #0b0b0b;

      --cds-surface-0: var(--cds-gray-20);
      --cds-surface-popover: #ffffff;
      --cds-text-primary: #141413;
      --cds-text-secondary: #5e5d59;
      --cds-text-muted: #878787;

      --cds-alpha-2: rgba(11, 11, 11, 0.08);
      --cds-border-strong: rgba(11, 11, 11, 0.2);
      --cds-ring-color: rgba(11, 11, 11, 0.1);
      --cds-shadow-popover: 0 8px 24px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.06);

      --cds-fill-accent: #257de0;
      --cds-fill-warning: #fbb315;
      --cds-fill-danger: #dc3c3d;

      /* Exact Claude Desktop chart palette */
      --cds-cat-1: #257de0;
      --cds-cat-2: #f47230;
      --cds-cat-3: #00b894;
      --cds-cat-4: #f2a600;
      --cds-ref: #878787;
      --cds-muted: #c2c2c2;
      --cds-ref-tint: rgba(135, 135, 135, 0.15);

      --cds-pill-bg: #f3f3f1;
      --cds-pill-bg-hover: #e7e7e3;
      --cds-btn-bg: rgba(11, 11, 11, 0.05);
      --cds-btn-bg-hover: rgba(11, 11, 11, 0.09);
      --radius-xl: 0.75rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --cds-surface-0: var(--cds-gray-900);
        --cds-surface-popover: #303030;
        --cds-text-primary: #f0eee6;
        --cds-text-secondary: #b0aea5;
        --cds-text-muted: #878787;

        --cds-alpha-2: rgba(255, 255, 255, 0.1);
        --cds-border-strong: rgba(255, 255, 255, 0.22);
        --cds-ring-color: rgba(255, 255, 255, 0.1);
        --cds-shadow-popover: 0 8px 24px rgba(0, 0, 0, 0.32), 0 2px 6px rgba(0, 0, 0, 0.2);

        --cds-fill-accent: #338ced;
        --cds-cat-1: #338ced;
        --cds-cat-2: #e76624;
        --cds-cat-3: #00a888;
        --cds-cat-4: #d28e05;
        --cds-ref: #878787;
        --cds-muted: #50504d;

        --cds-pill-bg: rgba(255, 255, 255, 0.08);
        --cds-pill-bg-hover: rgba(255, 255, 255, 0.14);
        --cds-btn-bg: rgba(255, 255, 255, 0.07);
        --cds-btn-bg-hover: rgba(255, 255, 255, 0.12);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--cds-surface-0);
      color: var(--cds-text-primary);
      padding: 12px;
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* Global Settings Bar */
    .settings-bar {
      width: 100%;
      max-width: 360px;
      margin: 0 auto 10px;
      background: var(--cds-surface-popover);
      border-radius: var(--radius-xl);
      box-shadow: inset 0 0 0 1px var(--cds-ring-color);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 12px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .settings-label {
      color: var(--cds-text-secondary);
      font-size: 12px;
    }

    .seg-group {
      display: inline-flex;
      background: var(--cds-btn-bg);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--cds-text-secondary);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
    }
    .seg-btn.active {
      background: var(--cds-surface-popover);
      color: var(--cds-text-primary);
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
      font-weight: 500;
    }

    .auto-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .threshold-select {
      border: 1px solid var(--cds-ring-color);
      background: var(--cds-btn-bg);
      color: var(--cds-text-primary);
      border-radius: 5px;
      font-size: 11px;
      padding: 2px 5px;
      cursor: pointer;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 28px;
      height: 16px;
      cursor: pointer;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: var(--cds-border-strong);
      border-radius: 999px;
      transition: background 150ms ease;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 999px;
      transition: transform 150ms ease;
    }
    .switch input:checked + .slider { background: var(--cds-fill-accent); }
    .switch input:checked + .slider::before { transform: translateX(12px); }

    /* Session Stack */
    .sessions-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
    }

    .popover-card {
      width: 100%;
      background: var(--cds-surface-popover);
      border-radius: var(--radius-xl);
      box-shadow: var(--cds-shadow-popover), inset 0 0 0 1px var(--cds-ring-color);
      padding: 6px 0;
      transition: box-shadow 180ms ease, background-color 180ms ease;
    }

    .popover-card.is-current {
      background: color-mix(in srgb, var(--cds-fill-accent) 4%, var(--cds-surface-popover));
      box-shadow: var(--cds-shadow-popover), inset 0 0 0 1px color-mix(in srgb, var(--cds-fill-accent) 28%, var(--cds-ring-color));
    }

    .session-head {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px 4px 12px;
      min-width: 0;
      cursor: pointer;
      user-select: none;
    }

    .session-icon {
      width: 14px;
      height: 14px;
      color: var(--cds-text-primary);
      flex-shrink: 0;
    }

    /* AGY-style 2x2 4-dot running indicator (from left sidebar) */
    @keyframes agyDotPulse {
      0%, 100% { opacity: 0.28; }
      50% { opacity: 0.95; }
    }
    .agy-dots {
      display: inline-grid;
      grid-template-columns: repeat(2, 3.5px);
      gap: 2px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
    }
    .agy-dots i {
      display: block;
      width: 3.5px;
      height: 3.5px;
      border-radius: 999px;
      background: var(--cds-text-secondary);
      animation: agyDotPulse 1.1s ease-in-out infinite;
    }
    .agy-dots i:nth-child(2) { animation-delay: 0.2s; }
    .agy-dots i:nth-child(4) { animation-delay: 0.4s; }
    .agy-dots i:nth-child(3) { animation-delay: 0.6s; }

    .session-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--cds-text-primary);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-pill {
      background: var(--cds-pill-bg);
      color: var(--cds-text-secondary);
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 5px;
      max-width: 78px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
      pointer-events: none;
    }

    .json-pill {
      border: none;
      background: var(--cds-pill-bg);
      color: var(--cds-text-secondary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 5px;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 120ms ease, color 120ms ease;
    }
    .json-pill:hover {
      background: var(--cds-pill-bg-hover);
      color: var(--cds-text-primary);
    }

    .ring-wrap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding-left: 2px;
      color: var(--cds-text-secondary);
      flex-shrink: 0;
    }
    .ring-trigger-pct { font-size: 11.5px; font-weight: 500; }
    .ring-svg { display: block; transform: rotate(-90deg); }
    .ring-arc { transition: stroke-dashoffset 300ms ease, stroke 200ms ease; }

    /* Smooth Accordion Body */
    .card-body-wrap {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition: grid-template-rows 220ms cubic-bezier(0.22, 1, 0.36, 1), opacity 180ms ease;
    }
    .card-body-wrap.collapsed {
      grid-template-rows: 0fr;
      opacity: 0;
    }
    .card-body-inner { overflow: hidden; }

    .popover-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 14px 4px;
      font-size: 12px;
      color: var(--cds-text-secondary);
    }
    .popover-summary { margin-left: auto; }

    .popover-body { padding: 2px 14px 4px; }

    .meter-track {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 9999px;
      overflow: hidden;
      background-color: var(--cds-ref-tint);
      margin-bottom: 10px;
    }
    .meter-seg {
      position: absolute;
      top: 0;
      bottom: 0;
      transition: inset-inline-start 300ms ease, width 300ms ease;
    }

    .breakdown-list { display: flex; flex-direction: column; }
    .breakdown-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      line-height: 1.4;
    }
    .breakdown-row + .breakdown-row { margin-top: 4px; }

    .breakdown-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      display: inline-block;
      flex-shrink: 0;
    }
    .breakdown-name {
      color: var(--cds-text-primary);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .breakdown-name.muted { color: var(--cds-text-secondary); }
    .breakdown-tokens { color: var(--cds-text-muted); flex-shrink: 0; }
    .breakdown-pct {
      color: var(--cds-text-primary);
      flex-shrink: 0;
      width: 44px;
      text-align: right;
    }
    .breakdown-pct.muted { color: var(--cds-text-muted); }

    /* Expandable > MCP tools & > Memory files sections */
    .sub-group {
      margin-top: 5px;
    }
    .sub-toggle {
      width: 100%;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 2px 0;
      font-size: 12px;
      color: var(--cds-text-secondary);
      cursor: pointer;
      text-align: left;
    }
    .sub-toggle:hover { color: var(--cds-text-primary); }
    .sub-caret {
      width: 10px;
      height: 10px;
      transition: transform 150ms ease;
      flex-shrink: 0;
    }
    .sub-toggle.open .sub-caret { transform: rotate(90deg); }
    .sub-label { flex: 1; }
    .sub-tokens { color: var(--cds-text-muted); }
    .sub-count { color: var(--cds-text-muted); width: 44px; text-align: right; }

    .sub-items {
      display: none;
      padding-left: 15px;
      margin-top: 2px;
    }
    .sub-items.open { display: block; }
    .sub-item {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--cds-text-muted);
      padding: 1px 0;
      gap: 8px;
    }
    .sub-item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .divider {
      height: 1px;
      margin: 6px 14px;
      background: var(--cds-alpha-2);
    }

    .compact-row {
      padding: 3px 14px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }
    .compact-hint {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--cds-text-secondary);
    }
    .compact-btn-wrap {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
    }
    .compact-btn {
      flex-shrink: 0;
      border: none;
      border-radius: 6px;
      background: var(--cds-btn-bg);
      color: var(--cds-text-primary);
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      cursor: pointer;
      transition: background 120ms ease, opacity 120ms ease;
    }
    .compact-btn:hover:not(:disabled) { background: var(--cds-btn-bg-hover); }
    .compact-btn:disabled {
      opacity: 0.35;
      color: var(--cds-text-muted);
      cursor: not-allowed;
    }
    /* Screenshot 3 style floating pill tooltip when disabled */
    .disabled-tip {
      display: none;
      position: absolute;
      right: 0;
      bottom: calc(100% + 6px);
      white-space: nowrap;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      background: var(--cds-surface-popover);
      color: var(--cds-text-primary);
      box-shadow: var(--cds-shadow-popover), inset 0 0 0 1px var(--cds-ring-color);
      pointer-events: none;
      z-index: 20;
    }
    .compact-btn-wrap.is-disabled:hover .disabled-tip {
      display: block;
    }

    .show-more-btn {
      width: 100%;
      max-width: 360px;
      margin: 8px auto 0;
      display: block;
      border: none;
      border-radius: 8px;
      background: var(--cds-btn-bg);
      color: var(--cds-text-secondary);
      font-size: 11.5px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .show-more-btn:hover {
      background: var(--cds-btn-bg-hover);
      color: var(--cds-text-primary);
    }
  </style>
</head>
<body>
  <div class="settings-bar">
    <div class="settings-row">
      <span class="settings-label">Context Window</span>
      <div class="auto-controls">
        <div class="seg-group" id="windowGroup">
          <button type="button" class="seg-btn" data-win="0">Auto</button>
          <button type="button" class="seg-btn" data-win="256000">256K</button>
          <button type="button" class="seg-btn" data-win="512000">512K</button>
          <button type="button" class="seg-btn" data-win="840000">840K</button>
          <button type="button" class="seg-btn" data-win="1000000">1M</button>
        </div>
        <button id="refreshBtn" type="button" class="compact-btn" title="Refresh sessions now">↻</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="settings-label">Auto-compact at</span>
      <div class="auto-controls">
        <select id="thresholdSelect" class="threshold-select tabular-nums" title="Auto-compact threshold">
          <option value="50">50%</option>
          <option value="60">60%</option>
          <option value="75">75%</option>
          <option value="85">85%</option>
          <option value="90">90%</option>
        </select>
        <label class="switch" title="Enable automatic /compact when idle and threshold reached">
          <input id="autoToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <div id="sessionsList" class="sessions-list">
    <div class="popover-card loading-placeholder" style="padding:14px 16px;color:var(--cds-text-secondary);font-size:12px;">Loading Antigravity sessions…</div>
  </div>
  <button id="showMoreBtn" type="button" class="show-more-btn" style="display:none"></button>

  <script>
    const RADIUS = 6;
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS;
    const COLOR_MAP = {
      "cat-1": "var(--cds-cat-1)",
      "cat-2": "var(--cds-cat-2)",
      "cat-3": "var(--cds-cat-3)",
      "cat-4": "var(--cds-cat-4)",
      "ref": "var(--cds-ref)",
      "muted": "var(--cds-muted)",
    };

    const params = new URLSearchParams(window.location.search);
    const convId = params.get("conversationId") || "";
    const token = params.get("token") || "";

    const sessionsList = document.getElementById("sessionsList");
    const thresholdSelect = document.getElementById("thresholdSelect");
    const autoToggle = document.getElementById("autoToggle");

    let activeExpandedId = null;
    let showAllSessions = false;
    const cardMap = new Map();
    const subExpandState = new Map(); // `${id}:mcp` | `${id}:mem` -> bool
    const showMoreBtn = document.getElementById("showMoreBtn");
    showMoreBtn.addEventListener("click", () => {
      showAllSessions = !showAllSessions;
      fetchContextOnce();
    });

    function stripDotZero(str) {
      return str.endsWith(".0") ? str.slice(0, -2) : str;
    }

    function formatTokens(n) {
      if (n >= 1e6) return stripDotZero((n / 1e6).toFixed(1)) + "M";
      if (n >= 1e3) {
        const k = Number((n / 1e3).toFixed(1));
        if (k >= 1e3) return stripDotZero((n / 1e6).toFixed(1)) + "M";
        return stripDotZero(k.toFixed(1)) + "k";
      }
      return String(n);
    }

    function getStrokeColor(pct) {
      if (pct >= 90) return "var(--cds-fill-danger)";
      if (pct >= 75) return "var(--cds-fill-warning)";
      return "var(--cds-fill-accent)";
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function updateSettings(patch) {
      const q = token ? `?token=${encodeURIComponent(token)}` : "";
      await fetch(`/api/settings${q}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });
    }

    async function triggerCompact(targetId, btn) {
      if (btn.disabled) return;
      const q = token ? `?token=${encodeURIComponent(token)}` : "";
      btn.disabled = true;
      btn.textContent = "Compacting…";
      try {
        const res = await fetch(`/api/compact${q}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ conversationId: targetId }),
        });
        const data = await res.json();
        btn.textContent = data.ok ? "Sent!" : "Failed";
      } catch {
        btn.textContent = "Error";
      }
      setTimeout(() => {
        btn.textContent = "Auto-compact";
        btn.disabled = false;
      }, 2000);
    }

    document.querySelectorAll("#windowGroup .seg-btn").forEach((btn) => {
      btn.addEventListener("click", () => updateSettings({ windowSize: Number(btn.dataset.win) }));
    });
    thresholdSelect.addEventListener("change", () => {
      updateSettings({ autoCompactThresholdPct: Number(thresholdSelect.value) });
    });
    autoToggle.addEventListener("change", () => {
      updateSettings({ autoCompactEnabled: autoToggle.checked });
    });

    function setExpandedSession(id) {
      activeExpandedId = activeExpandedId === id ? null : id;
      for (const [sid, el] of cardMap.entries()) {
        el.querySelector(".card-body-wrap").classList.toggle("collapsed", sid !== activeExpandedId);
      }
    }

    function createCard(s) {
      const card = document.createElement("div");
      card.className = "popover-card";
      card.dataset.id = s.id;
      card.innerHTML = `
        <div class="session-head">
          <svg class="session-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="3" width="11" height="7.5" rx="1.2"/>
            <path d="M1.5 12.5h13"/>
          </svg>
          <span class="agy-dots" style="display:none" title="Agent is running"><i></i><i></i><i></i><i></i></span>
          <span class="session-title"></span>
          <span class="folder-pill" style="display:none"></span>
          <button type="button" class="json-pill" title="Copy relative JSONL path"></button>
          <span class="ring-wrap tabular-nums">
            <svg width="14" height="14" viewBox="0 0 14 14" class="ring-svg" aria-hidden="true">
              <circle cx="7" cy="7" r="6" fill="none" stroke-width="2" stroke="var(--cds-border-strong)"/>
              <circle cx="7" cy="7" r="6" fill="none" stroke-width="2" stroke-dasharray="${CIRCUMFERENCE}" stroke-dashoffset="${CIRCUMFERENCE}" stroke-linecap="round" class="ring-arc"/>
            </svg>
            <span class="ring-trigger-pct">0%</span>
          </span>
        </div>
        <div class="card-body-wrap collapsed">
          <div class="card-body-inner">
            <div class="popover-header">
              <span>Context window</span>
              <span class="popover-summary tabular-nums"></span>
            </div>
            <div class="popover-body">
              <div class="meter-track"></div>
              <div class="breakdown-list"></div>
              <div class="sub-sections"></div>
            </div>
            <div class="divider"></div>
            <div class="compact-row">
              <span class="compact-hint tabular-nums"></span>
              <span class="compact-btn-wrap">
                <span class="disabled-tip">Cannot compact while the agent is running</span>
                <button type="button" class="compact-btn">Auto-compact</button>
              </span>
            </div>
          </div>
        </div>
      `;

      card.querySelector(".session-head").addEventListener("click", (e) => {
        if (e.target.closest(".json-pill")) return;
        setExpandedSession(s.id);
      });

      const jsonPill = card.querySelector(".json-pill");
      jsonPill.addEventListener("click", async (e) => {
        e.stopPropagation();
        const pathToCopy = jsonPill.dataset.relpath || "";
        if (!pathToCopy) return;
        try {
          await navigator.clipboard.writeText(pathToCopy);
          const orig = jsonPill.dataset.label;
          jsonPill.textContent = "Copied!";
          setTimeout(() => { jsonPill.textContent = orig; }, 1200);
        } catch {}
      });

      const cBtn = card.querySelector(".compact-btn");
      cBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        triggerCompact(s.id, cBtn);
      });

      return card;
    }

    function updateCard(card, s, win, thresholdTokens, thresholdPct) {
      card.classList.toggle("is-current", Boolean(s.isCurrent));
      card.querySelector(".agy-dots").style.display = s.isRunning ? "inline-grid" : "none";

      const titleEl = card.querySelector(".session-title");
      titleEl.textContent = s.title;
      titleEl.title = s.title;

      const folderEl = card.querySelector(".folder-pill");
      if (s.folderName) {
        folderEl.textContent = s.folderName;
        folderEl.title = s.folderName;
        folderEl.style.display = "inline-block";
      } else {
        folderEl.style.display = "none";
      }

      const jsonPill = card.querySelector(".json-pill");
      const jsonLabel = `${s.shortId}.jsonl`;
      jsonPill.dataset.relpath = s.relPath;
      jsonPill.dataset.label = jsonLabel;
      if (jsonPill.textContent !== "Copied!") {
        jsonPill.textContent = jsonLabel;
      }
      jsonPill.title = `Click to copy: ${s.relPath}`;

      const total = s.totalTokens || 0;
      const pct = win > 0 ? Math.round(Math.max(0, Math.min(1, total / win)) * 100) : 0;
      const summary = `${formatTokens(total)} / ${formatTokens(win)} (${pct}%)`;
      const offset = CIRCUMFERENCE * (1 - Math.max(0, Math.min(100, pct)) / 100);

      const arc = card.querySelector(".ring-arc");
      arc.setAttribute("stroke-dashoffset", String(offset));
      arc.setAttribute("stroke", getStrokeColor(pct));
      card.querySelector(".ring-trigger-pct").textContent = `${pct}%`;

      card.querySelector(".card-body-wrap").classList.toggle("collapsed", s.id !== activeExpandedId);
      card.querySelector(".popover-summary").textContent = summary;

      // Meter bar: draw cat-1..cat-4 + autocompact_buffer
      const allCats = s.categories || [];
      const barCats = allCats.filter((c) => c.tokens > 0 && c.colorKey !== "ref");
      let startPct = 0;
      const meterTrack = card.querySelector(".meter-track");
      meterTrack.innerHTML = barCats
        .map((c, idx) => {
          const w = Math.min(100 - startPct, (c.tokens / win) * 100);
          if (w <= 0) return "";
          const seam = idx === 0 ? 0 : 1;
          const rS = idx === 0 ? 2 : 1;
          const rE = idx === barCats.length - 1 ? 2 : 1;
          const color = COLOR_MAP[c.colorKey] || "var(--cds-cat-1)";
          const html = `<div class="meter-seg" style="inset-inline-start:calc(${startPct}% + ${seam}px);width:max(2px,calc(${w}% - ${seam}px));background:${color};border-start-start-radius:${rS}px;border-end-start-radius:${rS}px;border-start-end-radius:${rE}px;border-end-end-radius:${rE}px"></div>`;
          startPct += w;
          return html;
        })
        .join("");

      // Rows: all active categories + Free space + Deferred
      const bufferTokens = allCats.find((c) => c.name === "autocompact_buffer")?.tokens || 0;
      const freeTokens = Math.max(0, win - total - bufferTokens);
      const freePct = ((freeTokens / win) * 100).toFixed(1);

      let rowsHtml = allCats
        .filter((c) => c.tokens > 0)
        .map((c) => {
          const p = ((c.tokens / win) * 100).toFixed(1);
          const color = COLOR_MAP[c.colorKey] || "var(--cds-ref)";
          return `<div class="breakdown-row">
            <span class="breakdown-swatch" style="background:${color}"></span>
            <span class="breakdown-name">${esc(c.display_name)}</span>
            <span class="breakdown-tokens tabular-nums">${formatTokens(c.tokens)}</span>
            <span class="breakdown-pct tabular-nums">${p}%</span>
          </div>`;
        })
        .join("");

      rowsHtml += `<div class="breakdown-row">
        <span class="breakdown-swatch" style="background:var(--cds-ref-tint)"></span>
        <span class="breakdown-name">Free space</span>
        <span class="breakdown-tokens tabular-nums">${formatTokens(freeTokens)}</span>
        <span class="breakdown-pct tabular-nums">${freePct}%</span>
      </div>`;

      (s.deferred || []).forEach((d) => {
        if (d.tokens <= 0) return;
        rowsHtml += `<div class="breakdown-row">
          <span class="breakdown-swatch" style="background:var(--cds-muted)"></span>
          <span class="breakdown-name muted">${esc(d.display_name)}</span>
          <span class="breakdown-tokens tabular-nums">${formatTokens(d.tokens)}</span>
          <span class="breakdown-pct muted tabular-nums">—</span>
        </div>`;
      });

      card.querySelector(".breakdown-list").innerHTML = rowsHtml;

      // Expandable > MCP tools & > Memory files
      const details = s.details || {};
      const subEl = card.querySelector(".sub-sections");
      const mcpOpen = Boolean(subExpandState.get(`${s.id}:mcp`));
      const memOpen = Boolean(subExpandState.get(`${s.id}:mem`));

      subEl.innerHTML = `
        <div class="sub-group">
          <button type="button" class="sub-toggle ${mcpOpen ? "open" : ""}" data-sub="mcp">
            <svg class="sub-caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>
            <span class="sub-label">MCP tools</span>
            <span class="sub-tokens tabular-nums">${formatTokens(details.mcpTotalTokens || 0)}</span>
            <span class="sub-count tabular-nums">${details.mcpCount || 0}</span>
          </button>
          <div class="sub-items ${mcpOpen ? "open" : ""}">
            ${(details.mcpServers || []).map((m) => `<div class="sub-item"><span class="sub-item-name">${esc(m.name)} (${m.count})</span><span class="tabular-nums">${formatTokens(m.tokens)}</span></div>`).join("")}
          </div>
        </div>
        <div class="sub-group">
          <button type="button" class="sub-toggle ${memOpen ? "open" : ""}" data-sub="mem">
            <svg class="sub-caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>
            <span class="sub-label">Memory files</span>
            <span class="sub-tokens tabular-nums">${formatTokens(details.memoryTokens || 0)}</span>
            <span class="sub-count tabular-nums">${details.memoryCount || 0}</span>
          </button>
          <div class="sub-items ${memOpen ? "open" : ""}">
            ${(details.memoryFiles || []).map((f) => `<div class="sub-item"><span class="sub-item-name">${esc(f.name)}</span><span class="tabular-nums">${formatTokens(f.tokens)}</span></div>`).join("")}
          </div>
        </div>
      `;

      subEl.querySelectorAll(".sub-toggle").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const key = `${s.id}:${btn.dataset.sub}`;
          const next = !subExpandState.get(key);
          subExpandState.set(key, next);
          btn.classList.toggle("open", next);
          btn.nextElementSibling.classList.toggle("open", next);
        });
      });

      const untilAuto = Math.max(0, thresholdTokens - total);
      card.querySelector(".compact-hint").textContent =
        untilAuto > 0
          ? `${formatTokens(untilAuto)} until auto (${thresholdPct}%)`
          : `Reached ${thresholdPct}% (${formatTokens(thresholdTokens)})`;

      const cBtn = card.querySelector(".compact-btn");
      const cWrap = card.querySelector(".compact-btn-wrap");
      cWrap.classList.toggle("is-disabled", Boolean(s.isRunning));
      if (s.isRunning) {
        cBtn.disabled = true;
      } else if (cBtn.textContent === "Auto-compact") {
        cBtn.disabled = false;
      }
    }

    function renderSnapshot(snap) {
      const ph = sessionsList.querySelector(".loading-placeholder");
      if (ph) ph.remove();
      const { settings, thresholdTokens, sessions } = snap;

      document.querySelectorAll("#windowGroup .seg-btn").forEach((btn) => {
        btn.classList.toggle("active", Number(btn.dataset.win) === settings.windowSize);
      });
      thresholdSelect.value = String(settings.autoCompactThresholdPct);
      autoToggle.checked = Boolean(settings.autoCompactEnabled);

      const visible = showAllSessions ? sessions : sessions.slice(0, 6);
      if (sessions.length > 6) {
        showMoreBtn.style.display = "block";
        showMoreBtn.textContent = showAllSessions ? "Show fewer" : `Show all (${sessions.length})`;
      } else {
        showMoreBtn.style.display = "none";
      }

      if (activeExpandedId === null && visible.length > 0) {
        activeExpandedId = visible[0].id;
      }

      const activeIds = new Set(visible.map((s) => s.id));
      for (const [id, el] of cardMap.entries()) {
        if (!activeIds.has(id)) {
          el.remove();
          cardMap.delete(id);
        }
      }

      visible.forEach((s) => {
        let card = cardMap.get(s.id);
        if (!card) {
          card = createCard(s);
          cardMap.set(s.id, card);
        }
        const sWin = s.windowSize || settings.windowSize || 512000;
        const sThresh = s.thresholdTokens || Math.round(sWin * (settings.autoCompactThresholdPct / 100));
        updateCard(card, s, sWin, sThresh, settings.autoCompactThresholdPct);
        sessionsList.appendChild(card);
      });
    }

    let eventSource = null;

    async function fetchContextOnce() {
      try {
        const q = new URLSearchParams();
        if (convId) q.set("conversationId", convId);
        if (token) q.set("token", token);
        const res = await fetch(`/api/context?${q.toString()}`, { cache: "no-store" });
        if (res.ok) {
          renderSnapshot(await res.json());
          return true;
        }
      } catch {}
      setTimeout(fetchContextOnce, 1000);
      return false;
    }

    function connectSSE() {
      if (eventSource) eventSource.close();
      const q = new URLSearchParams();
      if (convId) q.set("conversationId", convId);
      if (token) q.set("token", token);
      eventSource = new EventSource(`/api/events?${q.toString()}`);
      eventSource.onmessage = (ev) => {
        try {
          renderSnapshot(JSON.parse(ev.data));
        } catch {}
      };
    }

    document.getElementById("refreshBtn").addEventListener("click", () => {
      fetchContextOnce();
      connectSSE();
    });

    fetchContextOnce();
    connectSSE();
  </script>
</body>
</html>
